spring:
  datasource:
    url: ${E2E_DB_URL:jdbc:postgresql://localhost:5432/marketplace_java_e2e}
    username: ${E2E_DB_USER:postgres}
    password: ${E2E_DB_PASSWORD:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false

firebase:
  project-id: ${FIREBASE_DEV_PROJECT_ID:marketplace-ptit-dev}
  jwk-set-uri: ${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
