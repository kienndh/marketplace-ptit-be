spring:
  application:
    name: marketplace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace_java_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:dev_password}
  data:
    redis:
      repositories:
        enabled: false  # chỉ dùng RedisTemplate, không dùng Redis repositories (tránh log nhiễu khi quét JPA repo)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

marketplace:
  chat:
    # Đọc từ biến môi trường như Python; mặc định 0 = chưa cấu hình → các route official-support trả 503 như Python
    official-support-group-id: ${OFFICIAL_SUPPORT_GROUP_ID:0}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:student-marketplace-ptit}
  jwk-set-uri: ${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
