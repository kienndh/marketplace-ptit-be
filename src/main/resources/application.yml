spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: marketplace
  datasource:
    url: jdbc:mysql://localhost:3307/${DB_NAME}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
