spring:
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/marketplace_java_test}
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

firebase:
  project-id: test-marketplace-ptit
  jwk-set-uri: https://example.com/test-jwks
